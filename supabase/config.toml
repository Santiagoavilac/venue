project_id = "venue-aftr"

[functions.baneco]
enabled = true
verify_jwt = false
# Una única fuente de la función; no se duplica dentro de supabase/functions.
entrypoint = "../db/functions/baneco/index.ts"
import_map = "../db/functions/baneco/import_map.json"

[functions.historias-media]
enabled = true
verify_jwt = false
entrypoint = "../db/functions/historias-media/index.ts"

# Faltaba declararla: se desplegaba a mano y por eso quedó con CORS * sin que
# nadie lo volviera a mirar. verify_jwt = false porque la acción de registro
# entra con el token del enlace de invitación, no con una sesión; la función
# valida sesión, invitación y rol según la acción.
[functions.crear-usuario]
enabled = true
verify_jwt = false
entrypoint = "../db/functions/crear-usuario/index.ts"

[functions.correo]
# El cartero: manda las entradas por correo desde la cola. Lo llama el cron,
# nunca un navegador, así que va sin verificación de JWT y con su propio token.
verify_jwt = false
entrypoint = "../db/functions/correo/index.ts"
import_map = "../db/functions/correo/import_map.json"
