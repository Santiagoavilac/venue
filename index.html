<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Venue — Event Management Platform</title>
<meta name="description" content="Venue — Event Management Platform. Listas, entradas QR, mesas y control de acceso.">
<!-- vista previa al compartir el link (WhatsApp y afines) -->
<meta property="og:title" content="Venue — Event Management Platform">
<meta property="og:description" content="Listas, entradas QR, mesas y control de acceso.">
<meta property="og:image" content="icon-512.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="rediseno.css">
<script>
/* el modo se aplica antes de pintar para que no parpadee: claro salvo que
   la persona haya elegido oscuro en su panel de perfil */
try { if (localStorage.getItem("venue.tema") === "oscuro") document.documentElement.dataset.tema = "oscuro"; } catch (e) {}
</script>
<style>
/* Ajustes propios de esta pantalla. El resto vive en styles.css:
   duplicar reglas acá las haría pisar el diseño por orden de cascada. */
.stats.pares{grid-template-columns:repeat(2,1fr);margin-bottom:16px;padding:0}
</style>
</head>
<body>

<!-- SPLASH: el logo de Venue mientras arranca -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-logo">
    <svg viewBox="132 132 248 256"><path d="M132 132h58l66 190 66-190h58L282 388h-52z"/></svg>
    <span>venue</span>
  </div>
</div>

<!-- LOGIN: primero se elige el acceso (boliche o relacionador); cada uno
     tiene su propio ingreso -->
<div class="login l2" id="login" data-paso="0" data-modo="inicio">
  <div class="l2-caja" id="lgInicio">
    <div class="l2-top"><span class="l2-marca">VENUE</span></div>
    <div class="l2-cuerpo">
      <h1>Bienvenido</h1>
      <p class="l2-sub">¿Cómo vas a entrar?</p>
      <div class="acc-ops">
        <button type="button" class="acc-op" data-modo="boliche">
          <span class="acc-ic"><svg viewBox="0 0 24 24" class="ic"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg></span>
          <span class="acc-tx"><b>Boliches</b><small>Administración y personal del local</small></span>
          <svg viewBox="0 0 24 24" class="ic acc-chev"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button type="button" class="acc-op" data-modo="rel">
          <span class="acc-ic"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 3.6-6 7-6s6 2 7 6"/></svg></span>
          <span class="acc-tx"><b>Relacionadores</b><small>Tu cuenta, tus boliches y tus ganancias</small></span>
          <svg viewBox="0 0 24 24" class="ic acc-chev"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="l2-caja hidden" id="lgRel"></div>
  <div class="l2-caja hidden" id="lgBoliche">
    <div class="l2-top">
      <span class="l2-marca" id="lgMarca">VENUE</span>
      <button type="button" class="l2-volver hidden" id="lgVolver" aria-label="Volver"><svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg></button>
    </div>
    <div class="l2-cuerpo login-brand" id="loginCard">
      <h1 id="lgTit">Ingresá tu usuario o correo</h1>
      <p class="l2-sub" id="lgSub">Acceso solo para personal autorizado</p>
      <!-- los dos campos quedan en la página para que el gestor de
           contraseñas del navegador los complete juntos -->
      <div id="lgPaso0">
        <label class="l2-rot" for="lgUser">USUARIO O CORREO</label>
        <input id="lgUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="tu.usuario" enterkeyhint="next">
      </div>
      <div id="lgPaso1" class="hidden">
        <label class="l2-rot" for="lgPass">CONTRASEÑA</label>
        <div class="l2-campo pw-wrap"><input id="lgPass" type="password" autocomplete="current-password" enterkeyhint="go"><button type="button" class="pw-eye" id="lgEye" aria-label="Ver contraseña"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <p class="l2-nota">¿Olvidaste tu contraseña? Pedile a tu jefe de team o al administrador que te la restablezca.</p>
      </div>
      <div id="loginErr" class="l2-err"></div>
    </div>
    <button class="l2-boton" id="btnLogin" disabled>Siguiente</button>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">

  <!-- Barra lateral (escritorio) · navegación permanente -->
  <aside class="nav" id="nav">
    <div class="nav-top">
      <button class="nav-club" id="clubBtn" aria-label="Cambiar de boliche">
        <span class="club-mark" id="clubMark">·</span>
        <span class="nav-club-txt">
          <span class="club-name" id="clubName">Cargando…</span>
          <span class="nav-club-sub">Cambiar local</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" id="clubChev"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <nav class="nav-items" id="tabbar" aria-label="Secciones"></nav>

    <div class="nav-bottom">
      <button class="nav-user" id="avatar" aria-label="Cuenta">
        <span class="avatar" id="avatarIni">·</span>
        <span class="nav-user-txt">
          <span class="nav-user-nm" id="userNm"></span>
          <span class="nav-user-rol" id="clubSub"></span>
        </span>
      </button>
      <button class="nav-toggle" id="navToggle" title="Contraer el menú" aria-label="Contraer el menú">
        <svg viewBox="0 0 24 24" class="ic"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
  </aside>

  <!-- Zona de trabajo -->
  <div class="work">
    <header class="topbar">
      <div class="tb-ctx">
        <button class="tb-club" id="tbClub" aria-label="Cambiar de boliche">
          <span class="club-mark sm" id="tbClubMark">·</span>
          <span class="tb-club-tx"><span class="tb-club-k">Club</span><span id="tbClubName">Cargando…</span></span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <span class="tb-sep" aria-hidden="true"></span>
        <button class="tb-ev" id="tbEv">
          <svg class="ic tb-ev-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span class="tb-ev-tx">
          <span class="tb-ev-nm" id="tbEvNm">Sin evento</span>
          <span class="tb-ev-meta" id="tbEvMeta"></span>
          </span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>

      <div class="tb-acc">
        <button class="tb-search" id="btnBuscar" title="Buscar persona, entrada o mesa">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Buscar…</span>
          <kbd>⌘ K</kbd>
        </button>
        <button class="iconbtn" id="btnAlertas" title="Alertas" aria-label="Alertas">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 3a6 6 0 0 0-6 6c0 4-1.5 5.5-1.5 5.5h15S18 13 18 9a6 6 0 0 0-6-6ZM10 18.5a2 2 0 0 0 4 0"/></svg>
          <span class="badge hidden" id="alertasN"></span>
        </button>
        <button class="avatar tb-avatar" id="avatarM" aria-label="Cuenta">·</button>
      </div>
    </header>

    <div class="evsel" id="evsel"></div>

    <main id="main" class="screen"></main>

  <!-- ESCÁNER (portero) -->
  <main class="scanwrap hidden" id="scanwrap">
    <div class="viewfinder" id="viewfinder">
      <video id="cam" playsinline muted class="hidden"></video>
      <div class="vf-frame"></div>
      <div class="vf-flash" id="vfFlash"></div>
      <div class="vf-hint" id="vfHint">Apuntá al QR de la entrada</div>
    </div>
    <div class="scan-actions">
      <button class="btn primary" id="btnCam">Iniciar cámara</button>
      <button class="btn ghost2 hidden" id="btnTorch" title="Encender la linterna del celular">Linterna</button>
      <button class="btn ghost2" id="btnSonido" title="Silenciar el pitido del escáner" aria-label="Silenciar el pitido del escáner" aria-pressed="false"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <button class="btn ghost2" id="btnFiltro" title="Modo filtro: rechaza sin consumir la entrada" aria-label="Modo filtro"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg></button>
    </div>
    <div class="manual">
      <label for="scanCode" class="sr-only">Código de la entrada</label>
      <input id="scanCode" placeholder="o escribí el código" title="Código de 10 caracteres, ej. QHXNG5PZK6" maxlength="24" autocomplete="off" autocapitalize="characters" enterkeyhint="go">
      <button id="btnVal">Validar</button>
    </div>
    <div id="scanResult"></div>
    <div class="sh-h" style="margin-top:20px">Ingresos<span class="r-sub" id="scanCount"></span></div>
    <div id="scanHist"></div>
  </main>

  </div><!-- /.work -->

  <!-- Navegación inferior (móvil) · se llena desde el mismo tabsFor() -->
  <nav class="botnav" id="botnav" aria-label="Secciones"></nav>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <button class="sheet-x" id="sheetX" aria-label="Cerrar" title="Cerrar (Esc)">
      <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="sheetBody"></div>
  </section>
</div>

<!-- Panel de perfil: se abre desde la inicial -->
<div class="pp-velo" id="ppVelo"></div>
<aside class="panel-perfil" id="panelPerfil" aria-label="Perfil y ajustes"></aside>

<div class="club-menu" id="clubMenu">
  <!-- Poblado en runtime por renderClubMenu() en app.js, desde la tabla
       `clubs` — con boliches creados dinámicamente no hay una cantidad
       fija de botones que se pueda escribir acá a mano. -->
  <div class="cm-card" id="cmCardBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="config.js"></script>
<script src="contabilidad.js"></script>
<script src="app.js"></script>
<script src="relacionador.js"></script>
<script src="reporte-escritorio.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="motion.js"></script>
<script>/* dev-login.js es opcional y solo existe en la máquina de quien desarrolla.
   El servidor local (dev.mjs) responde vacío cuando no está, así que se
   puede pedir directo sin ensuciar la consola con un 404. */
if (["localhost", "127.0.0.1"].includes(location.hostname)) {
  const s = document.createElement("script"); s.src = "dev-login.js"; document.body.appendChild(s);
}</script>
</body>
</html>
