<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>AFTR · Nightlife & Events</title>
<meta name="description" content="Descubrí la noche: eventos, entradas, listas y mesas en un solo lugar.">
<link rel="icon" href="img/icono.png">
<link rel="apple-touch-icon" href="img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="aftr.css" rel="stylesheet">
</head>
<body>

<!-- arranque: la A, destellos de fotos y AFTR armándose (igual que la app) -->
<div id="splash" aria-hidden="true">
  <div class="sp-fotos"></div>
  <img class="sp-marca" src="img/marca.svg" alt="">
  <div class="sp-palabra">
    <div class="sp-letras">
      <img src="img/a.svg" alt=""><img src="img/f.svg" alt=""><img src="img/t.svg" alt=""><img src="img/r.svg" alt="">
    </div>
    <div class="sp-lema">NIGHTLIFE &amp; EVENTS</div>
  </div>
</div>

<header id="barra">
  <button class="chip-ciudad" type="button">Santa Cruz <svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button>
  <a href="#/" class="palabra-barra" aria-label="AFTR">
    <img src="img/a.svg" alt=""><img src="img/f.svg" alt=""><img src="img/t.svg" alt=""><img src="img/r.svg" alt="">
  </a>
  <nav class="nav-escritorio">
    <a href="#/" data-tab="descubrir">Descubrir</a>
    <a href="#/mapa" data-tab="mapa">Mapa</a>
    <a href="#/accesos" data-tab="accesos">Accesos</a>
  </nav>
  <a href="#/cuenta" class="avatar" id="avatar" aria-label="Cuenta"></a>
</header>

<main id="vista"></main>

<nav id="tabs">
  <a href="#/" data-tab="descubrir"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Descubrir</span><i></i></a>
  <a href="#/mapa" data-tab="mapa"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span>Mapa</span><i></i></a>
  <a href="#/accesos" data-tab="accesos"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 000-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg><span>Accesos</span><i></i><b class="globo" id="globo" hidden></b></a>
  <a href="#/cuenta" data-tab="cuenta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Cuenta</span><i></i></a>
</nav>

<div id="hoja-fondo" hidden></div>
<section id="hoja" role="dialog" aria-modal="true" hidden><div class="manija"></div><div id="hoja-cuerpo"></div></section>
<div id="aviso" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="aftr.js"></script>
</body>
</html>
