<!doctype html>

<meta charset="utf-8">
<!-- Seguridad del documento. La sesión vive en esta misma página y hasta ahora
     no había ninguna cabecera: tres CDN podían cargar lo que quisieran.
     `script-src` sin 'unsafe-inline' es lo que hace que un XSS no pueda
     ejecutar nada; por eso en los templates no quedan handlers en línea.
     frame-ancestors y nosniff no funcionan por <meta>: van en vercel.json,
     que es donde se despliega esto. La CSP estricta ahi esta acotada a
     /aftr_web/: la web de Venue, en la raiz del repo, tiene trece onclick en
     linea y con script-src estricto se rompe. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https://cxksjarupexptfksnptg.supabase.co; worker-src 'self' blob:; connect-src 'self' https://cxksjarupexptfksnptg.supabase.co wss://cxksjarupexptfksnptg.supabase.co https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
